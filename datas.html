<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Datas e Informações</title>

    <!-- Google Fonts para a fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

    <style>
        /* Aplicando a fonte Poppins em todo o texto */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url('imagem4.jpg') no-repeat center center fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;  /* Centraliza horizontalmente */
            align-items: center;      /* Centraliza verticalmente */
        }

        .container {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            background-color: rgba(255, 255, 255, 0.85);
            opacity: 0; /* Inicialmente invisível para animação */
            transform: translateY(-50px); /* Desliza do topo */
            transition: opacity 1s ease-out, transform 1s ease-out; /* Animação suave */
            width: 100%; /* Garante que o contêiner ocupe toda a largura da tela */
            max-width: 450px; /* Max largura para manter um limite */
        }

        h2 {
            text-align: center;
            color: #000;
        }

        label {
            font-size: 16px;
            color: #000;
            margin-bottom: 8px;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
            box-sizing: border-box;
        }

        /* Estilo do botão */
        button.btn {
            background-color: #e91e63; /* rosa */
            color: white;
            border: none;
            padding: 14px 0;  /* Mais padding para aumentar a altura do botão */
            cursor: pointer;
            text-align: center;
            border-radius: 30px; /* Bordas arredondadas maiores */
            width: 100%; /* O botão ocupará 100% da largura do contêiner */
            box-sizing: border-box;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            display: block;
        }

        button.btn:hover {
            background-color: #d81b60; /* rosa mais escuro no hover */
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="container" id="formContainer">
        <h2>Datas e Informações sobre a Hospedagem</h2>

        <!-- Iniciando o formulário -->
        <form id="hospedagemForm" action="pagamento.html" method="GET">
            <label for="checkin">Data de Check-in:</label>
            <input id="checkin" name="checkin" type="date" required />

            <label for="checkout">Data de Check-out:</label>
            <input id="checkout" name="checkout" type="date" required />

            <label for="pessoas">Quantidade de Pessoas:</label>
            <input id="pessoas" name="pessoas" type="number" min="1" required />

            <label for="quartos">Quantidade de Quartos:</label>
            <input id="quartos" name="quartos" type="number" min="1" required />

            <label for="vagas">Quantidade de vagas no estacionamento:</label>
            <input id="vagas" name="vagas" type="number" min="0" required />

            <!-- Botão de envio com validação -->
            <button type="submit" class="btn">Próximo</button>
        </form>
    </div>

    <script>
        // Função para adicionar animação no carregamento do formulário
        window.onload = function () {
            const formContainer = document.getElementById('formContainer');
            formContainer.style.opacity = 1;  // Torna visível
            formContainer.style.transform = 'translateY(0)';  // Desliza para sua posição final
        }
    </script>

</body>

</html>
