<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrada</title>

    <!-- Google Fonts para a fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

    <style>
        /* Aplicando a fonte Poppins em todo o texto */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('capasite.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: rgba(0, 0, 0, 0.3); /* Camada escura com 30% de opacidade */
        }

        header {
            text-align: center;
            padding: 10px 20px;
            background-color: transparent;
            color: white;
            font-size: 2.5em;
        }

        .content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .welcome-text {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            background-color: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 15px;
            /* Inicialmente fora da tela à esquerda */
            transform: translateX(-100%);
            transition: transform 1s ease-out;
        }

        .btn-link {
            display: inline-block;
            margin: 40px 20px 0;
            padding: 12px 30px;
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn-pink {
            background-color: #e91e63;
            color: white;
        }

        .btn-pink:hover {
            background-color: #d81b60;
        }

        .btn-green {
            background-color: #28a745;
            color: white;
        }

        .btn-green:hover {
            background-color: #218838;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: auto;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="content">
    <div class="welcome-text">
        Bem-vindo ao Ody Park!<br />
        <a href="conheca.html" target="_blank" class="btn-link btn-green">Conheça o resort</a>
        <a href="cadastroo.html" target="_blank" class="btn-link btn-pink">Faça sua reserva</a>
    </div>
</div>

<footer>
    &copy; 2025 Ody Park - Ana Julia, Lorena, Maria e Sofia
</footer>

<script>
    // Espera até que o conteúdo da página esteja carregado
    window.onload = function() {
        // Aplica a animação: move o texto para sua posição final
        document.querySelector('.welcome-text').style.transform = 'translateX(0)';
    }
</script>

</body>
</html>
