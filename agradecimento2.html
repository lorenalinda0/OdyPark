<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmação de Reserva - Odypark</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                  url('imagem6.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .container {
      max-width: 500px;
      margin: 80px auto;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      text-align: center;
      color: #333;
      z-index: 1;
      animation: fadeIn 1.2s ease-out forwards;
      transform: translateY(20px);
      opacity: 0;
      position: relative;
    }

    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2em;
      color: #333;
    }

    p {
      font-size: 1.1em;
      line-height: 1.6;
      color: #555;
    }

    .contact-info {
      margin-top: 30px;
      font-size: 1.2em;
      color: #444;
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .contact-info a {
      color: #e91e63;
      text-decoration: none;
      font-weight: bold;
      position: relative;
      animation: pulse 2.5s infinite;
      text-shadow: 0 0 6px rgba(233, 30, 99, 0.7);
      transition: color 0.3s ease;
    }

    .contact-info a:hover {
      color: #c2185b;
      text-decoration: underline;
      text-shadow: 0 0 10px rgba(194, 24, 91, 0.9);
    }

    @keyframes pulse {
      0% { text-shadow: 0 0 6px rgba(233, 30, 99, 0.7); }
      50% { text-shadow: 0 0 12px rgba(233, 30, 99, 1); }
      100% { text-shadow: 0 0 6px rgba(233, 30, 99, 0.7); }
    }

    .copy-btn {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 1em;
      background-color: #e91e63;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .copy-btn:hover {
      background-color: #c2185b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Obrigado pela sua reserva!</h1>
    <p>Sua hospedagem no <strong>Odypark</strong> foi confirmada com sucesso.</p>
    <p>Agradecemos por escolher nosso espaço para viver momentos incríveis em meio à natureza!</p>

    <div class="contact-info">
      <p>Se precisar de mais informações ou assistência, não hesite em nos contactar:</p>
      <p><strong>Telefone:</strong> <a id="phoneLink" href="tel:+550000000000">+55 (00) 0000-0000</a></p>
      <button class="copy-btn" onclick="copiarTelefone()">Copiar número</button>
    </div>
  </div>

  <script>
  
    // Função para copiar o número de telefone
    function copiarTelefone() {
      const telefone = document.getElementById('phoneLink').textContent;
      navigator.clipboard.writeText(telefone).then(() => {
        alert('Número copiado para a área de transferência!');
      }).catch(err => {
        alert('Erro ao copiar número: ' + err);
      });
    }
  </script>

</body>
</html>
